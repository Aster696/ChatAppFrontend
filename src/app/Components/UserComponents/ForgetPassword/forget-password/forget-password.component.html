<app-nav-bar></app-nav-bar>
<div class="container mt-5">
    <div class="col-xs-4 col-sm-4 col-md-4 mx-auto">
        <div class="card bg-dark text-primary">
            <div class="card-header text-center border-bottom border-primary">
                <div class="card-title h3">
                    Forgot Password
                </div>
            </div>
            <div class="card-body">
                <form action="">
                    <div class="form-group">
                        <input [(ngModel)]="user.email" type="email" name="email" placeholder="Enter your email" class="form-control rounded-pill"/>
                    </div>
                    <div class="form-group">
                        <button [disabled]="!user.email" (click)="forgotPassword()" type="submit" class="btn btn-primary rounded-pill w-100">
                            Send Link
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
